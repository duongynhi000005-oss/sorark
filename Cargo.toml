[workspace]
resolver = "3"
members = [
    "crates/sorark-ir",
    "crates/sorark-ast",
    "crates/sorark-wasm",
    "crates/sorark-diff",
    "crates/sorark-cli",
]
exclude = [
    "examples/vulnerable-vault",
    "examples/upgrade-v1",
    "examples/upgrade-v2-broken",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sorark-labs/sorark"
homepage = "https://github.com/sorark-labs/sorark"
authors = ["SORARK Maintainers"]
keywords = ["stellar", "soroban", "static-analysis", "linter", "security"]
categories = ["command-line-utilities", "development-tools", "cryptography::cryptocurrencies"]

[workspace.dependencies]
sorark-ir = { path = "crates/sorark-ir", version = "0.1.0" }
sorark-ast = { path = "crates/sorark-ast", version = "0.1.0" }
sorark-wasm = { path = "crates/sorark-wasm", version = "0.1.0" }
sorark-diff = { path = "crates/sorark-diff", version = "0.1.0" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stellar-xdr = { version = "22.0", default-features = false, features = ["curr", "std", "serde"] }
syn = { version = "2.0", features = ["full", "visit", "extra-traits", "parsing"] }
thiserror = "2.0"
toml = "0.8"
walkdir = "2.5"
wasmparser = "0.224"
tempfile = "3.14"

[workspace.lints.rust]
unsafe_code = "forbid"
nonstandard_style = { level = "deny", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
redundant_clone = "deny"
clone_on_copy = "deny"
needless_collect = "deny"
manual_ok_or = "deny"
map_unwrap_or = "deny"
